# ============================================================================
# DNSLogHUB 配置文件 (config.yaml) —— 逐项详细批注
#
# 我的域名: example.com
# 运行前提(重要):
#   1. 需要在域名服务商处把 "example.com" 的 NS(nameserver) 记录指向本服务器公网IP,
#      DNS 解析请求才会被转发到本程序监听的 53 端口。
#   2. 如果修改了本文件中的"用户子域名", 服务端重启后浏览器端必须清空 localStorage。
# ============================================================================

Http:
  # HTTP/多协议监听地址。0.0.0.0 表示监听全部网卡(公网+内网), 便于外部访问。
  # 一般保持 0.0.0.0 即可，无需改动。
  host: 0.0.0.0

  # HTTP/多协议对外端口 (与 DNS 的 53 端口相互独立)。
  # WEB管理界面、/api 接口、以及 HTTP/LDAP/RMI 回调都复用这个端口。
  # 注意: 若与 DNS 同时跑, 需要保证 53 和 8000 均未被占用且开放防火墙。
  port: 8000

  # consoleDisable: 是否禁用 WEB 管理界面。
  #   false = 启用内置前端页面 (访问 http://IP:8000/ 可打开管理界面)
  #   true  = 关闭前端, 仅保留 API 接口 (适合纯粹用脚本/SDK 调用的场景)
  consoleDisable: false

# ---------------------------------------------------------------------------
# User: 多用户配置 (token → 子域名前缀)
# 格式:  键 = 登录 token, 值 = 该用户专属的子域名前缀
# 一个域(如 example.com)可拆成多个互不干扰的用户通道, 每个用户用不同 token 访问。
#   - token 就是该用户的"密码", 用于调用 /api 接口鉴权 (放在请求头 token 中)
#   - 子域名前缀决定了该用户收到的回调域名
# 命名规则: 用户子域名前缀 + "." + Dns.domain = 该用户专属域名
#   例: 上面 'admin':'dnslog' 在域名 example.com 下 →
#         admin 用户的完整子域名 = dnslog.example.com
#         它产生的回调域名形如  abc.dnslog.example.com
#
# 重要约束:
#   - token 与子域名前缀都应使用"强随机、不易撞"的字符串(本项目鉴权为明文token)。
#   - 各用户的子域名前缀不要存在"包含关系"(如 'aaa' 与 'axxx'),
#     因为服务端用字符串包含判断归属, 会误判。
#   - 每个值(子域名前缀)必须是唯一的, 不能两个用户共用同一前缀。
User:
  # "token": "用户对应子域名"           # ← 示例模板, 使用时可删除
  'admin': 'dnslog'

# ---------------------------------------------------------------------------
# Dns: 域名与静态 DNS 记录配置
Dns:
  # domain: 你的根域名(不带前导点、不带结尾点! 直接写完整根域名)。
  # 关键!!! 域名是 example.com, 这里写 example.com, 不要写成 skin。
  #   写错会导致 DNS 过滤不生效 / 子域名拼接错乱 / 收不到回调。
  domain: example.com
  # domains:                     # 可选：多域名列表（含主域名）
  #   - example.com
  #   - log2.example.com

  # ARecord: 静态 A 记录 (host → IPv4), 用于临时解析测试 或 让 NS 自解析。
  # 格式:  <子域> : <IPv4地址>
  # 效果: 当外部查询  <子域>.example.com 的 A 记录时, 返回对应 IP。
  # 例:  'www': '1.1.1.1'  →  www.example.com 解析为 1.1.1.1
  #
  # 说明:
  #   - 这里的记录是"全局"的, 不区分用户 token, 涉及  <子域>.example.com
  #   - 若某查询未命中本 ARecord 表, 服务端会统一返回 127.0.0.1 (兜底)
  #   - 运行中可通过 /api/setARecord 动态增删, 但重启后以本文件为准
  # 可根据需要增删多条, 如下:
  ARecord:
    'www': '1.1.1.1'
    # 'ns1': '1.1.1.1'      # 例: 给 example.com 指定 NS 解析
    # 'abc': '2.2.2.2'

# ---------------------------------------------------------------------------
# Register: 用户注册功能配置
#   enabled: 是否开启注册。true 时访问首页进入欢迎页，可跳转注册页；注册必须使用邀请码。
#   邀请码由独立工具 cmd/invitegen 生成（bcrypt 哈希），用户与邀请码均持久化到 SQLite。
Register:
  enabled: false
  rateLimitPerMinute: 5

# ---------------------------------------------------------------------------
# Log: 审计日志配置（滚动写入、保留策略）
Log:
  level: info          # debug / info / warn / error
  dir: logs            # 日志目录（审计日志写入 logs/audit.log）
  maxSize: 10          # 单文件大小上限 (MB)
  maxBackups: 7        # 最多保留的历史文件数
  maxAge: 30           # 历史文件最长保留天数

# ---------------------------------------------------------------------------
# Data: 记录持久化配置（重启后恢复 DNS/HTTP/LDAP/RMI 记录）
Data:
  dbFile: data/dnsloghub.db        # SQLite 数据库文件
  flushInterval: 10                # 内存记录批量落盘间隔（秒），退出时也会落盘

# ---------------------------------------------------------------------------
# Admin: 管理接口配置
Admin:
  token: ""                        # 管理员令牌（非空则启用 /api/admin/* 管理接口）
  loginPath: /admin                # 后台登录页路径（可自定义）
  dashboardPath: /admin/dashboard  # 后台管理页路径（可自定义）
